[tool.poetry]
name = "common-benefits-sdk"
version = "0.0.0"
description = "Python SDK for the CommonBenefits protocol: codegen-free extensions, a typed client, and custom filters."
authors = ["Agile Six"]
readme = "README.md"
packages = [{ include = "common_benefits_sdk" }]

[tool.poetry.dependencies]
python = "^3.11"
pydantic = "^2.11.0"
typing-extensions = "^4.12.0"
httpx = ">=0.27,<0.29"

[tool.poetry.group.dev.dependencies]
black = "^24.0.0"
mypy = "^1.11.0"
pyright = "^1.1.380"
pytest = "^8.0.0"
ruff = ">=0.6,<0.16"

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
disallow_untyped_defs = false
plugins = ["pydantic.mypy"]

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "basic"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
