name: "PR: Conventional Title"

on:
  pull_request_target:
    types:
      - opened
      - edited
      - synchronize
      - reopened

permissions:
  contents: read
  pull-requests: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Must match the types release-please-config.json knows about.
          types: |
            feat
            fix
            docs
            refactor
            build
            chore
            ci
            test
          # Scopes are optional but, when present, must be one of these.
          scopes: |
            core
            sdk
            website
          requireScope: false
          subjectPattern: ^[a-z].*[^.]$
          subjectPatternError: |
            The subject "{subject}" found in the PR title "{title}" must:
              - start with a lowercase letter
              - not end with a period
          wip: true
