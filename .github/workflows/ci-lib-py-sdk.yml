name: "CI - Python SDK: Run Checks"

on:
  workflow_call:
  pull_request:
    paths:
      - lib/py-sdk/**
      - .github/workflows/ci-lib-py-sdk.yml

defaults:
  run:
    working-directory: ./lib/py-sdk

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry
        run: pipx install poetry

      - name: Install dependencies
        run: poetry install

      - name: Run checks
        run: make checks
